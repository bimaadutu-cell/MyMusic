<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF0000" />
    <title>MyMusik Offline</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#030303;color:white;font-family:Inter,system-ui,sans-serif}
      section{max-width:520px;margin:24px;padding:28px;border:1px solid rgba(255,0,0,.25);border-radius:28px;background:#121212;text-align:center}
      img{width:140px;border-radius:50%;margin:auto;box-shadow:0 0 34px rgba(255,0,0,.4)}
      h1{font-size:clamp(2rem,8vw,3.4rem);margin:22px 0 8px}
      p{color:#bbb;line-height:1.7}
      .btn{display:inline-block;margin-top:18px;padding:14px 20px;border-radius:999px;background:#ff0000;color:#fff;font-weight:800;text-decoration:none}
    </style>
  </head>
  <body>
    <section>
      <img src="/icons/mymusik-logo.png" alt="MyMusik offline" />
      <h1>MyMusik Offline</h1>
      <p>Antarmuka aplikasi tetap bisa dibuka dari cache PWA. Sambungkan internet untuk memuat pemutar musik resmi dan metadata terbaru.</p>
      <a class="btn" href="/">Coba Lagi</a>
    </section>
  </body>
</html>
